<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
<title id="title">WSUSによる更新管理の流れ</title>
<desc id="desc">Microsoft Updateから同期し、WSUSサーバーで内容を確認し、管理者が承認した更新を検証用PC、一般社員PC、Windows Serverへ段階配布する流れ</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#1565d8"/></marker>
 <style>.t{font-family:Segoe UI,Meiryo,sans-serif;fill:#0f172a}.s{font-family:Segoe UI,Meiryo,sans-serif;fill:#64748b}.b{fill:#fff;stroke:#2563eb;stroke-width:2}.n{fill:#1565d8}.l{stroke:#1565d8;stroke-width:3;fill:none;marker-end:url(#a)}.soft{fill:#f7faff}</style>
</defs>
<rect width="1400" height="390" rx="24" class="soft"/>
<g transform="translate(28 36)">
 <circle class="n" cx="96" cy="0" r="22"/><text x="96" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">1</text>
 <rect x="26" y="34" width="140" height="34" rx="17" fill="#fff" stroke="#8bb7ff"/><text x="96" y="57" text-anchor="middle" class="t" fill="#1565d8" font-size="18" font-weight="800">同期</text>
 <rect class="b" x="0" y="84" width="192" height="184" rx="18"/><path class="n" d="M57 141c4-17 27-22 39-9 16-8 34 5 30 22 15 2 19 21 7 29H54c-16-7-13-33 3-36z"/>
 <text class="t" x="96" y="215" text-anchor="middle" font-size="19" font-weight="800">Microsoft Update</text><text class="s" x="96" y="244" text-anchor="middle" font-size="15">更新プログラムの配信元</text>
</g>
<path class="l" d="M229 208H285"/>
<g transform="translate(292 36)">
 <circle class="n" cx="96" cy="0" r="22"/><text x="96" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">2</text>
 <rect x="15" y="34" width="162" height="34" rx="17" fill="#fff" stroke="#8bb7ff"/><text x="96" y="57" text-anchor="middle" class="t" fill="#1565d8" font-size="18" font-weight="800">内容を確認</text>
 <rect class="b" x="0" y="84" width="192" height="184" rx="18"/><rect class="n" x="62" y="121" width="68" height="58" rx="9"/><path d="M78 138h36M78 153h36" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
 <text class="t" x="96" y="215" text-anchor="middle" font-size="21" font-weight="800">WSUSサーバー</text><text class="s" x="96" y="239" text-anchor="middle" font-size="14">更新情報と更新ファイルを</text><text class="s" x="96" y="260" text-anchor="middle" font-size="14">保存・管理</text>
</g>
<path class="l" d="M493 208H549"/>
<g transform="translate(556 36)">
 <circle class="n" cx="96" cy="0" r="22"/><text x="96" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">3</text>
 <rect x="15" y="34" width="162" height="34" rx="17" fill="#fff" stroke="#8bb7ff"/><text x="96" y="57" text-anchor="middle" class="t" fill="#1565d8" font-size="18" font-weight="800">配布を承認</text>
 <rect class="b" x="0" y="84" width="192" height="184" rx="18"/><circle class="n" cx="96" cy="140" r="20"/><path class="n" d="M61 184c2-29 68-29 70 0z"/>
 <text class="t" x="96" y="215" text-anchor="middle" font-size="21" font-weight="800">管理者</text><text class="s" x="96" y="239" text-anchor="middle" font-size="14">分類・対象・配布時期を</text><text class="s" x="96" y="260" text-anchor="middle" font-size="14">判断</text>
</g>
<path class="l" d="M757 208H813"/>
<g transform="translate(820 36)">
 <circle class="n" cx="270" cy="0" r="22"/><text x="270" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">4</text>
 <rect x="210" y="34" width="120" height="34" rx="17" fill="#fff" stroke="#8bb7ff"/><text x="270" y="57" text-anchor="middle" class="t" fill="#1565d8" font-size="18" font-weight="800">配布</text>
 <rect class="b" x="0" y="84" width="540" height="184" rx="18"/>
 <rect class="b" x="12" y="110" width="156" height="132" rx="14"/><rect class="n" x="65" y="132" width="50" height="34" rx="4"/><rect class="n" x="59" y="169" width="62" height="5" rx="2"/><text class="t" x="90" y="202" text-anchor="middle" font-size="18" font-weight="800">検証用PC</text><text class="s" x="90" y="228" text-anchor="middle" font-size="14">テスト・検証</text>
 <path class="l" d="M174 176H186"/>
 <rect class="b" x="192" y="110" width="156" height="132" rx="14"/><circle class="n" cx="247" cy="146" r="12"/><path class="n" d="M229 171c1-18 35-18 36 0z"/><rect class="n" x="270" y="146" width="34" height="25" rx="3"/><text class="t" x="270" y="202" text-anchor="middle" font-size="18" font-weight="800">一般社員PC</text><text class="s" x="270" y="228" text-anchor="middle" font-size="13">一般ユーザー環境へ配布</text>
 <path class="l" d="M354 176H366"/>
 <rect class="b" x="372" y="110" width="156" height="132" rx="14"/><rect class="n" x="424" y="132" width="52" height="44" rx="7"/><path d="M436 146h28M436 158h28" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text class="t" x="450" y="202" text-anchor="middle" font-size="16.5" font-weight="800">Windows Server</text><text class="s" x="450" y="228" text-anchor="middle" font-size="13.5">サーバー環境へ配布</text>
</g>
</svg>
