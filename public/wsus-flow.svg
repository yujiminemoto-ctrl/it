<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1050" role="img" aria-labelledby="title desc">
  <title id="title">WSUSによる更新管理の流れ</title>
  <desc id="desc">Microsoft Updateから同期し、管理者が確認と承認を行い、WSUSから検証用PC、一般社員PC、Windows Serverへ更新を配布する縦型の図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#0078d4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="760" height="1050" rx="32" fill="url(#bg)"/>

  <g font-family="Segoe UI, Meiryo, sans-serif">
    <rect x="155" y="45" width="450" height="112" rx="24" fill="#ffffff" stroke="#0078d4" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="220" cy="101" r="31" fill="#e7f3ff"/>
    <path d="M203 107c0-12 9-21 21-21 8 0 15 4 19 11 2-1 5-2 8-2 10 0 18 8 18 18s-8 18-18 18h-44c-10 0-18-8-18-18 0-8 6-15 14-17z" fill="#0078d4"/>
    <text x="405" y="94" text-anchor="middle" font-size="25" font-weight="700" fill="#18334d">Microsoft Update</text>
    <text x="405" y="125" text-anchor="middle" font-size="15" fill="#5f6f7f">更新プログラムの配信元</text>

    <line x1="380" y1="158" x2="380" y2="224" stroke="#0078d4" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="270" y="175" width="220" height="46" rx="23" fill="#ffffff" stroke="#b8d8f2"/>
    <circle cx="302" cy="198" r="17" fill="#0078d4"/>
    <text x="302" y="204" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1</text>
    <text x="390" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#0078d4">同期</text>

    <rect x="130" y="238" width="500" height="210" rx="28" fill="#e8f4fd" stroke="#0078d4" stroke-width="3" filter="url(#shadow)"/>
    <rect x="310" y="270" width="140" height="86" rx="16" fill="#0078d4"/>
    <rect x="334" y="293" width="92" height="10" rx="5" fill="#ffffff"/>
    <rect x="334" y="317" width="92" height="10" rx="5" fill="#ffffff"/>
    <circle cx="424" cy="338" r="5" fill="#8ed1ff"/>
    <text x="380" y="390" text-anchor="middle" font-size="27" font-weight="800" fill="#18334d">WSUSサーバー</text>
    <text x="380" y="420" text-anchor="middle" font-size="16" fill="#516475">更新情報と更新ファイルを保存・管理</text>

    <line x1="380" y1="449" x2="380" y2="520" stroke="#0078d4" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="250" y="466" width="260" height="48" rx="24" fill="#ffffff" stroke="#b8d8f2"/>
    <circle cx="284" cy="490" r="17" fill="#0078d4"/>
    <text x="284" y="496" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2</text>
    <text x="390" y="496" text-anchor="middle" font-size="18" font-weight="700" fill="#0078d4">内容を確認</text>

    <rect x="155" y="535" width="450" height="128" rx="24" fill="#ffffff" stroke="#6f8fa8" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="225" cy="599" r="34" fill="#edf3f7"/>
    <circle cx="225" cy="588" r="12" fill="#526d82"/>
    <path d="M202 623c4-17 14-25 23-25s19 8 23 25" fill="#526d82"/>
    <text x="405" y="590" text-anchor="middle" font-size="23" font-weight="800" fill="#18334d">管理者</text>
    <text x="405" y="620" text-anchor="middle" font-size="15" fill="#5f6f7f">影響・対象・配布時期を判断</text>

    <line x1="380" y1="665" x2="380" y2="736" stroke="#107c41" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="250" y="682" width="260" height="48" rx="24" fill="#ffffff" stroke="#b8dbc8"/>
    <circle cx="284" cy="706" r="17" fill="#107c41"/>
    <text x="284" y="712" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
    <text x="390" y="712" text-anchor="middle" font-size="18" font-weight="700" fill="#107c41">配布を承認</text>

    <rect x="130" y="751" width="500" height="100" rx="24" fill="#eaf7ef" stroke="#107c41" stroke-width="3" filter="url(#shadow)"/>
    <text x="380" y="793" text-anchor="middle" font-size="25" font-weight="800" fill="#174b2f">承認済み更新</text>
    <text x="380" y="824" text-anchor="middle" font-size="15" fill="#4f6e5d">指定したコンピューターグループへ配布</text>

    <line x1="380" y1="852" x2="380" y2="920" stroke="#107c41" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="270" y="867" width="220" height="48" rx="24" fill="#ffffff" stroke="#b8dbc8"/>
    <circle cx="302" cy="891" r="17" fill="#107c41"/>
    <text x="302" y="897" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">4</text>
    <text x="390" y="897" text-anchor="middle" font-size="18" font-weight="700" fill="#107c41">配布</text>

    <g fill="#ffffff" stroke="#5f8fb5" stroke-width="2">
      <rect x="45" y="935" width="205" height="78" rx="18"/>
      <rect x="278" y="935" width="205" height="78" rx="18"/>
      <rect x="510" y="935" width="205" height="78" rx="18"/>
    </g>
    <g font-size="17" font-weight="700" fill="#18334d">
      <text x="147" y="982" text-anchor="middle">検証用PC</text>
      <text x="380" y="982" text-anchor="middle">一般社員PC</text>
      <text x="612" y="982" text-anchor="middle">Windows Server</text>
    </g>
  </g>
</svg>
